<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1250" width="1240" height="1250" font-family="DejaVu Sans, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a3f4b"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8641a"/></marker></defs>
<rect width="1240" height="1250" fill="#ffffff"/>
<text x="620" y="44" text-anchor="middle" font-size="25" font-weight="bold" font-style="normal" fill="#1f2430">Рис. 2. Предсказание: объединение модели с переносом мотива</text>
<text x="620" y="74" text-anchor="middle" font-size="16" font-weight="normal" font-style="normal" fill="#555b68">каждая ветвь оценивает все позиции генома; оценки приводятся к общей шкале и суммируются</text>
<rect x="380" y="100" width="480" height="56" rx="28" fill="#f3f4f7" stroke="#7d8799" stroke-width="1.6"/>
<text x="620" y="134.3" text-anchor="middle" font-size="18" font-weight="bold" font-style="normal" fill="#1f2430">Вход: последовательность белка и геном</text>
<line x1="620" y1="156" x2="620" y2="178" stroke="#3a3f4b" stroke-width="1.8"/>
<line x1="320" y1="178" x2="920" y2="178" stroke="#3a3f4b" stroke-width="1.8"/>
<line x1="320" y1="178" x2="320" y2="232" stroke="#3a3f4b" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="920" y1="178" x2="920" y2="232" stroke="#3a3f4b" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="320" y="214" text-anchor="middle" font-size="18" font-weight="bold" font-style="normal" fill="#1d4e85">Ветвь А. Нейросетевая модель</text>
<text x="920" y="214" text-anchor="middle" font-size="18" font-weight="bold" font-style="normal" fill="#8a4a10">Ветвь Б. Перенос мотива по гомологии</text>
<rect x="130" y="196" width="380" height="26" fill="#ffffff"/>
<rect x="700" y="196" width="440" height="26" fill="#ffffff"/>
<text x="320" y="216" text-anchor="middle" font-size="18" font-weight="bold" font-style="normal" fill="#1d4e85">Ветвь А. Нейросетевая модель</text>
<text x="920" y="216" text-anchor="middle" font-size="18" font-weight="bold" font-style="normal" fill="#8a4a10">Ветвь Б. Перенос мотива по гомологии</text>
<rect x="50" y="234" width="540" height="96" rx="8" fill="#dbeaf9" stroke="#3f7fbf" stroke-width="1.6"/>
<text x="320" y="277.2" text-anchor="middle" font-size="16" font-weight="bold" font-style="normal" fill="#1f2430">А1. Вектор белка</text>
<text x="320" y="298" text-anchor="middle" font-size="16" font-weight="normal" font-style="normal" fill="#1f2430">ESM-2 → обучаемая белковая часть (рис. 1)</text>
<rect x="650" y="234" width="540" height="96" rx="8" fill="#fde6c8" stroke="#d9822b" stroke-width="1.6"/>
<text x="920" y="266.8" text-anchor="middle" font-size="16" font-weight="bold" font-style="normal" fill="#1f2430">Б1. Поиск гомолога с известными сайтами</text>
<text x="920" y="287.6" text-anchor="middle" font-size="16" font-weight="normal" font-style="normal" fill="#1f2430">MMseqs2, банк из 6 226 белков с известными сайтами;</text>
<text x="920" y="308.4" text-anchor="middle" font-size="16" font-weight="normal" font-style="normal" fill="#1f2430">идентичность ≥ 40%, покрытие ≥ 80%</text>
<line x1="320" y1="330" x2="320" y2="358" stroke="#3a3f4b" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="920" y1="330" x2="920" y2="358" stroke="#3a3f4b" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="50" y="360" width="540" height="96" rx="8" fill="#dbeaf9" stroke="#3f7fbf" stroke-width="1.6"/>
<text x="320" y="392.8" text-anchor="middle" font-size="16" font-weight="bold" font-style="normal" fill="#1f2430">А2. Ансамбль из 13 сетей</text>
<text x="320" y="413.6" text-anchor="middle" font-size="16" font-weight="normal" font-style="normal" fill="#1f2430">каждая сеть m даёт оценку sₘ(i)</text>
<text x="320" y="434.4" text-anchor="middle" font-size="16" font-weight="normal" font-style="normal" fill="#1f2430">для каждой позиции i генома</text>
<rect x="650" y="360" width="540" height="96" rx="8" fill="#fde6c8" stroke="#d9822b" stroke-width="1.6"/>
<text x="920" y="392.8" text-anchor="middle" font-size="16" font-weight="bold" font-style="normal" fill="#1f2430">Б2. Мотив гомолога</text>
<text x="920" y="413.6" text-anchor="middle" font-size="16" font-weight="normal" font-style="normal" fill="#1f2430">его сайты (до 60) → выравнивание → PWM:</text>
<text x="920" y="434.4" text-anchor="middle" font-size="16" font-weight="normal" font-style="normal" fill="#1f2430">логарифм отношения частот к составу генома</text>
<line x1="320" y1="456" x2="320" y2="484" stroke="#3a3f4b" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="920" y1="456" x2="920" y2="484" stroke="#3a3f4b" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="50" y="486" width="540" height="96" rx="8" fill="#dbeaf9" stroke="#3f7fbf" stroke-width="1.6"/>
<text x="320" y="529.2" text-anchor="middle" font-size="16" font-weight="bold" font-style="normal" fill="#1f2430">А3. Сглаживание по окну</text>
<text x="320" y="550" text-anchor="middle" font-size="16" font-weight="normal" font-style="normal" fill="#1f2430">максимум sₘ в окне 21 п. н. с центром в i</text>
<rect x="650" y="486" width="540" height="96" rx="8" fill="#fde6c8" stroke="#d9822b" stroke-width="1.6"/>
<text x="920" y="518.8" text-anchor="middle" font-size="16" font-weight="bold" font-style="normal" fill="#1f2430">Б3. Сканирование генома матрицей PWM</text>
<text x="920" y="539.6" text-anchor="middle" font-size="16" font-weight="normal" font-style="normal" fill="#1f2430">максимум по двум цепям;</text>
<text x="920" y="560.4" text-anchor="middle" font-size="16" font-weight="normal" font-style="normal" fill="#1f2430">затем максимум в окне 21 п. н.</text>
<line x1="320" y1="582" x2="320" y2="610" stroke="#3a3f4b" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="920" y1="582" x2="920" y2="610" stroke="#3a3f4b" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="50" y="612" width="540" height="96" rx="8" fill="#dbeaf9" stroke="#3f7fbf" stroke-width="1.6"/>
<text x="320" y="644.8" text-anchor="middle" font-size="16" font-weight="bold" font-style="normal" fill="#1f2430">А4. Приведение к общей шкале</text>
<text x="320" y="665.6" text-anchor="middle" font-size="16" font-weight="normal" font-style="normal" fill="#1f2430">z-преобразование по геному для каждой сети,</text>
<text x="320" y="686.4" text-anchor="middle" font-size="16" font-weight="normal" font-style="normal" fill="#1f2430">затем среднее по 13 сетям</text>
<rect x="650" y="612" width="540" height="96" rx="8" fill="#fde6c8" stroke="#d9822b" stroke-width="1.6"/>
<text x="920" y="655.2" text-anchor="middle" font-size="16" font-weight="bold" font-style="normal" fill="#1f2430">Б4. Приведение к общей шкале</text>
<text x="920" y="676" text-anchor="middle" font-size="16" font-weight="normal" font-style="normal" fill="#1f2430">z-преобразование по геному</text>
<rect x="210" y="738" width="220" height="46" rx="23" fill="#2f6fb3" stroke="#1d4e85" stroke-width="1.6"/>
<text x="320" y="767.3" text-anchor="middle" font-size="18" font-weight="bold" font-style="normal" fill="#ffffff">z<tspan dy="5" font-size="13">model</tspan><tspan dy="-5">(i)</tspan></text>
<rect x="810" y="738" width="220" height="46" rx="23" fill="#f4a340" stroke="#c8641a" stroke-width="1.6"/>
<text x="920" y="767.3" text-anchor="middle" font-size="18" font-weight="bold" font-style="normal" fill="#1f2430">z<tspan dy="5" font-size="13">motif</tspan><tspan dy="-5">(i)</tspan></text>
<line x1="320" y1="708" x2="320" y2="736" stroke="#3a3f4b" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="920" y1="708" x2="920" y2="736" stroke="#3a3f4b" stroke-width="1.8" marker-end="url(#ar)"/>
<circle cx="620" cy="848" r="26" fill="#ffffff" stroke="#1f2430" stroke-width="2.2"/>
<text x="620" y="859" text-anchor="middle" font-size="32" font-weight="bold" font-style="normal" fill="#1f2430">+</text>
<path d="M320,784 V848 H592" fill="none" stroke="#3a3f4b" stroke-width="1.8" marker-end="url(#ar)"/>
<path d="M920,784 V848 H648" fill="none" stroke="#3a3f4b" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="620" y1="874" x2="620" y2="906" stroke="#3a3f4b" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="250" y="908" width="740" height="86" rx="10" fill="#f0f7ee" stroke="#4c9a52" stroke-width="2"/>
<text x="620" y="945.6" text-anchor="middle" font-size="18" font-weight="bold" font-style="normal" fill="#1f2430">Итоговая оценка позиции:   S(i) = z<tspan dy="5" font-size="13">model</tspan><tspan dy="-5">(i)</tspan> + z<tspan dy="5" font-size="13">motif</tspan><tspan dy="-5">(i)</tspan></text>
<text x="620" y="969" text-anchor="middle" font-size="18" font-weight="normal" font-style="normal" fill="#1f2430">если гомолог не найден:   S(i) = z<tspan dy="5" font-size="13">model</tspan><tspan dy="-5">(i)</tspan></text>
<line x1="620" y1="994" x2="620" y2="1024" stroke="#3a3f4b" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="250" y="1026" width="740" height="62" rx="8" fill="#ffffff" stroke="#4c9a52" stroke-width="1.6"/>
<text x="620" y="1052.2" text-anchor="middle" font-size="16" font-weight="normal" font-style="normal" fill="#1f2430">Ранжирование позиций по убыванию S(i);</text>
<text x="620" y="1073" text-anchor="middle" font-size="16" font-weight="normal" font-style="normal" fill="#1f2430">отбор неперекрывающихся участков, уточнение их центров</text>
<line x1="620" y1="1088" x2="620" y2="1118" stroke="#3a3f4b" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="280" y="1120" width="680" height="56" rx="28" fill="#4c9a52" stroke="#2e7d32" stroke-width="2"/>
<text x="620" y="1153.95" text-anchor="middle" font-size="17" font-weight="bold" font-style="normal" fill="#ffffff">Список сайтов-кандидатов: координаты, S, вклады модели и мотива</text>
<text x="620" y="1214" text-anchor="middle" font-size="15" font-weight="normal" font-style="normal" fill="#555b68">z-преобразование: z = (x − μ) / σ, где μ и σ обозначают среднее и стандартное отклонение оценки по всем позициям генома</text>
</svg>
